[package]
name = "lingxi-display-studio"
version = "0.1.3"
description = "Cross-platform controller for the Linx68 narrow display"
authors = ["Lingxi Display Studio Contributors"]
edition = "2021"

[lib]
name = "lingxi_display_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
